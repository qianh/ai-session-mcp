name: Publish npm package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-14
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@^11.15.0
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BRAINHUB_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.BRAINHUB_GOOGLE_OAUTH_CLIENT_ID }}
          BRAINHUB_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.BRAINHUB_GOOGLE_OAUTH_CLIENT_SECRET }}
